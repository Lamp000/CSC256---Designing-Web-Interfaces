<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="THING">GameShelf</title>
    <link href="final.css" rel="stylesheet">
</head>
<header>
    <button>
        <img id="homebutton" src="61972.png" onclick="goHome()">
    </button>
</header>
<body>
    <div id="selectPlaylist"></div>
    <div id="cover" hidden="true"></div>
    <section id="playlistHold" class="hold">
        <h2>Playlists</h2>
        <button id="playlistButton" onclick="toggleForm('addPlaylistForm');toggleForm('playlistButton')">Add a Playlist</button>
        <form id="addPlaylistForm" hidden="true">
            <label for="playlistName">Playlist Title</label>
            <input type="text" id="playlistName" placeholder="Enter game title" required>
            <br>
            <!-- <label for="typeInput">Game Type</label>
            <select id="typeInput" required>
                <option value="video-game">Video Game</option>
                <option value="board-game">Board Game</option>
            </select>
            <br> -->
            <label for="playlistImage">Cover Image</label>
            <input type="file" id="playlistImage" accept="image/*" required>
            <br>
            <button type="submit">Submit</button>
        </form>
        <br>
        <div id="playlistCollection"></div>
    </section>
    <main id="gameHold" class="hold">
        <h2>Collection</h2>
        <button id="gameButton" onclick="toggleForm('addGameForm');toggleForm('gameButton')">Add a Game</button>
        <form id="addGameForm" hidden="true">
            <label for="gameName">Game Title</label>
            <input type="text" id="gameName" placeholder="Enter game title" required>
            <br>
            <!-- <label for="typeInput">Game Type</label>
            <select id="typeInput" required>
                <option value="video-game">Video Game</option>
                <option value="board-game">Board Game</option>
            </select>
            <br> -->
            <label for="gameImage">Cover Image</label>
            <input type="file" id="gameImage" accept="image/*" required>
            <br>
            <button type="submit">Submit</button>
        </form>
        <br>
        <div id="gameCollection"></div>
    </main>
    <script src="finalpage.js"></script>
    <script>
        // Start the database
        openDatabase(); 
    </script>
</body>
</html>
